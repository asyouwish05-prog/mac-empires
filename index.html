<body>
<title>McDonald's EMPIRES</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen war table. A lacquer header, a full-bleed ink map with gold territory, a lacquer command sheet that rises from the bottom. */
:root {
  --ink: #0d0c0a;
  --ink-2: #16130f;
  --lacquer: #1b1712;
  --line: #3a3124;
  --gold: #d4af37;
  --gold-hi: #f0d68a;
  --crimson: #a31e1e;
  --crimson-hi: #c7342b;
  --jade: #5cc4a0;
  --paper: #efe6d0;
  --muted: #a69c86;
  --warn: #e98a3a;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
h2, h3, p { margin: 0; }
body { background: var(--ink); color: var(--paper); font-family: var(--font-body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; }

/* header */
.hdr { background: var(--lacquer); border-bottom: 1px solid var(--gold); padding-block: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; z-index: 5; }
.hdr-rank { min-width: 0; }
.hdr-eyebrow { font-size: 10px; letter-spacing: .2em; color: var(--muted); }
.hdr-title { font-family: var(--font-display); font-weight: 800; font-size: 19px; color: var(--gold-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-stats { display: flex; gap: 14px; flex-shrink: 0; }
.stat { text-align: right; }
.stat b { display: block; font-family: var(--font-display); font-size: 20px; color: var(--paper); font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 10px; color: var(--muted); letter-spacing: .12em; }
.ticker { background: var(--ink-2); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); padding-block: 6px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; z-index: 5; }
.ticker.warn { color: var(--warn); }
.ticker.good { color: var(--gold-hi); }

/* map */
.mapwrap { flex: 1; position: relative; min-height: 0; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#gmap { position: absolute; inset: 0; background: var(--ink); }
.g #map { pointer-events: none; }
.tools { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 4; }
.tools.left { right: auto; left: max(12px, env(safe-area-inset-left, 0px)); }
.tool { width: 46px; height: 46px; border-radius: 50%; background: rgba(27,23,18,.92); border: 1px solid var(--gold); color: var(--gold-hi); font-family: var(--font-display); font-weight: 800; font-size: 15px; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.5); position: relative; }
.tool small { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); font-family: var(--font-body); font-weight: 500; font-size: 9px; color: var(--muted); white-space: nowrap; letter-spacing: .05em; text-shadow: 0 1px 3px #000; }
.tool.on { background: var(--crimson); color: #fff; }
.tools .tool + .tool { margin-top: 10px; }

/* bottom sheet */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--lacquer); border-top: 1px solid var(--gold); border-radius: 14px 14px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.6); padding-top: 14px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding-left: var(--gutter-l); padding-right: var(--gutter-r); max-height: 72%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; }
.seal { flex-shrink: 0; width: 46px; height: 46px; border-radius: 6px; background: var(--crimson); color: var(--gold-hi); border: 1px solid var(--gold); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; line-height: 1; text-align: center; }
.seal b { font-size: 20px; display: block; }
.seal i { font-style: normal; font-size: 9px; letter-spacing: .1em; }
.seal.none { background: transparent; border-style: dashed; border-color: var(--jade); color: var(--jade); }
.sheet-name { font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.25; color: var(--paper); text-wrap: balance; }
.sheet-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.sheet-headtext { flex: 1; min-width: 0; }
.x { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 18px; line-height: 1; }
.meter { display: flex; flex-direction: column; gap: 5px; }
.meter-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 8px; }
.meter-row b { color: var(--paper); font-weight: 500; }
.bar { height: 6px; background: var(--ink); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-hi)); }
.guard { font-size: 12px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.guard.ok b { color: var(--gold-hi); }
.guard.soon { border-color: var(--warn); color: var(--warn); }
.guard.fallen { border-color: var(--crimson-hi); color: #ffb3a8; background: rgba(163,30,30,.15); }
.guard.eternal { border-color: var(--gold); color: var(--gold-hi); }
.rations { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ration { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px; border-radius: 8px; background: linear-gradient(160deg, #6e1515, #3d0b0b); border: 1px solid var(--gold); color: var(--paper); min-height: 58px; }
.ration .k { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--gold-hi); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 16px; color: var(--gold-hi); }
.ration span { display: block; font-size: 12px; line-height: 1.3; min-width: 0; }
.ration em { font-style: normal; font-family: var(--font-display); font-weight: 800; color: var(--gold-hi); font-size: 14px; }
.ration.hot { box-shadow: 0 0 0 2px var(--gold-hi); }
.ration:disabled { filter: grayscale(.8) brightness(.6); }
.undo { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 8px 10px; border: 1px dashed var(--line); border-radius: 6px; }
.linkbtn { background: none; border: none; color: var(--gold-hi); text-decoration: underline; font-size: 12px; padding: 4px; }
.sect-label { font-size: 10px; letter-spacing: .2em; color: var(--muted); }
textarea, input[type=text] { width: 100%; background: var(--ink); color: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: inherit; font-size: 14px; -webkit-user-select: text; user-select: text; }
textarea { min-height: 56px; resize: vertical; }
.history { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.history div { display: flex; justify-content: space-between; gap: 8px; }
.sheet-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 7px 12px; font-size: 12px; }
.ghost.danger { border-color: var(--crimson-hi); color: #ffb3a8; }
.primary { background: var(--gold); color: var(--ink); border: none; border-radius: 6px; padding: 9px 16px; font-weight: 700; font-size: 14px; }

/* cut-in */
.cutin { position: absolute; left: 0; right: 0; top: 36%; z-index: 9; pointer-events: none; background: linear-gradient(90deg, rgba(110,15,15,0), rgba(140,20,20,.96) 12%, rgba(140,20,20,.96) 88%, rgba(110,15,15,0)); border-top: 2px solid var(--gold-hi); border-bottom: 2px solid var(--gold-hi); text-align: center; padding: 12px var(--gutter-r) 14px var(--gutter-l); }
.cutin .ey { font-size: 11px; letter-spacing: .4em; color: var(--gold-hi); }
.cutin .tx { font-family: var(--font-display); font-weight: 800; font-size: 26px; color: #fff; text-shadow: 0 2px 0 #000, 0 0 18px rgba(240,214,138,.6); text-wrap: balance; }
.cutin.play { animation: band 1.3s cubic-bezier(.2,.8,.2,1) both; }
@keyframes band { 0% { transform: scaleY(0) skewY(-4deg); opacity: 0; } 12% { transform: scaleY(1.15) skewY(-2deg); opacity: 1; } 22% { transform: scaleY(1) skewY(0); } 85% { opacity: 1; } 100% { opacity: 0; transform: translateX(8%); } }
@media (prefers-reduced-motion: reduce) { .cutin.play { animation: fade 1.3s both; } @keyframes fade { 0%,100% { opacity: 0; } 10%,85% { opacity: 1; } } }

/* menu */
.menu { position: absolute; inset: 0; z-index: 8; background: var(--ink); display: flex; flex-direction: column; }
.menu-head { display: flex; align-items: center; justify-content: space-between; padding-block: 12px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); border-bottom: 1px solid var(--line); }
.menu-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--gold-hi); }
.tabs { display: flex; gap: 4px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); padding: 10px 12px; font-size: 14px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--gold-hi); border-bottom-color: var(--gold); font-weight: 700; }
.menu-body { flex: 1; overflow-y: auto; padding-block: 16px 32px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); display: flex; flex-direction: column; gap: 18px; }
.menu-body > * { max-width: 640px; width: 100%; margin-inline: auto; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.kv div { background: var(--lacquer); padding: 10px 12px; }
.kv span { display: block; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.kv b { font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; }
h3 { font-family: var(--font-display); font-weight: 800; font-size: 16px; color: var(--gold-hi); margin-bottom: 8px; }
.ranks { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.ranks div { display: flex; justify-content: space-between; color: var(--muted); padding: 4px 0; border-bottom: 1px dotted var(--line); }
.ranks div.cur { color: var(--gold-hi); font-weight: 700; }
.treasures { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.tr { border: 1px solid var(--gold); border-radius: 8px; padding: 10px; background: rgba(212,175,55,.07); min-width: 0; }
.tr b { font-family: var(--font-display); font-size: 14px; color: var(--gold-hi); display: block; }
.tr p { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
.tr .need { font-size: 10px; color: var(--paper); margin-top: 6px; letter-spacing: .05em; }
.tr.locked { border-color: var(--line); background: transparent; }
.tr.locked b { color: var(--muted); }
.months { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 6px; align-items: end; height: 150px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.mcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-variant-numeric: tabular-nums; }
.mcol i { width: 70%; background: linear-gradient(0deg, var(--crimson), var(--crimson-hi)); border-top: 2px solid var(--gold-hi); border-radius: 2px 2px 0 0; min-height: 2px; }
.mcol span { font-size: 11px; color: var(--paper); }
.mlabels { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 6px; text-align: center; font-size: 11px; color: var(--muted); margin-top: 4px; }
.mix { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.mix-row { display: grid; grid-template-columns: 7em 1fr 3em; gap: 8px; align-items: center; }
.mix-row .bar { height: 8px; }
.mix-row span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.clist { display: flex; flex-direction: column; }
.crow { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.crow .lv { font-family: var(--font-display); font-weight: 800; color: var(--gold-hi); font-size: 13px; text-align: center; border: 1px solid var(--gold); border-radius: 4px; padding: 3px 0; }
.crow .lv.z { color: var(--jade); border-color: var(--jade); border-style: dashed; }
.crow .nm { min-width: 0; }
.crow .nm b { display: block; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow .nm small { font-size: 11px; color: var(--muted); }
.crow .ct { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.crow .ct.warn { color: var(--warn); }
.note { font-size: 12px; color: var(--muted); line-height: 1.7; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.empty { font-size: 13px; color: var(--muted); padding: 12px; border: 1px dashed var(--line); border-radius: 8px; text-align: center; }
</style>

<div class="app">
  <header class="hdr">
    <div class="hdr-rank">
      <div class="hdr-eyebrow">官位</div>
      <div class="hdr-title" id="rank">浪人（見習い）</div>
    </div>
    <div class="hdr-stats">
      <div class="stat"><b id="h-cc">0</b><span>制圧城</span></div>
      <div class="stat"><b id="h-pt">0</b><span>総兵力</span></div>
    </div>
  </header>
  <div class="ticker" id="ticker">陣図を読み込み中…</div>

  <div class="mapwrap" id="wrap">
    <div id="gmap" hidden></div>
    <canvas id="map" aria-label="支配圏の地図"></canvas>

    <div class="tools left">
      <button class="tool" id="b-bgm" aria-label="合戦BGM">鼓<small>BGM</small></button>
    </div>
    <div class="tools">
      <button class="tool" id="b-loc" aria-label="現在地へ">陣<small>現在地</small></button>
      <button class="tool" id="b-fit" aria-label="全領土を表示">全<small>全領土</small></button>
      <button class="tool" id="b-build" aria-label="新しい城を築く">築<small>築城</small></button>
      <button class="tool" id="b-scan" aria-label="周辺の店舗を偵察">偵<small>偵察</small></button>
      <button class="tool" id="b-menu" aria-label="軍略メニュー">略<small>軍略</small></button>

    <section class="menu" id="menu" hidden>
      <div class="menu-head"><h2>天下統一・軍略記録</h2><button class="x" id="menu-x" aria-label="閉じる">×</button></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="war" aria-selected="true">戦況</button>
        <button class="tab" role="tab" data-tab="month" aria-selected="false">月報</button>
        <button class="tab" role="tab" data-tab="list" aria-selected="false">城一覧</button>
        <button class="tab" role="tab" data-tab="treasure" aria-selected="false">十大秘宝</button>
        <button class="tab" role="tab" data-tab="data" aria-selected="false">記録管理</button>
      </div>
      <div class="menu-body" id="menu-body"></div>
    </section>
  </div>
</div>

<script>
(function () {

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- rules ---------- */

const rankOf = p => { let r = RANKS[0]; for (const x of RANKS) if (p >= x[0]) r = x; return r; };

  lsSet(KEY, json);
  if (!dbRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const body = { json: JSON.stringify(state), updated: state.updated };
    writing = writing.then(() => dbRef.set(body)).catch(err => {
      if (err && err.code === 'unavailable') return new Promise(r => setTimeout(r, 800 + Math.random() * 800)).then(() => dbRef.set(body)).catch(() => {});

    });

async function connectCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    dbRef = db.doc('data/users/' + id + '/empire');
    const snap = await dbRef.get();
    if (snap.exists) {
      let remote = null;
      try { remote = JSON.parse(snap.data().json); } catch (e) {}
      if (valid(remote) && (remote.updated || 0) >= (state.updated || 0)) {
        state = remote; lsSet(KEY, JSON.stringify(state)); recompute(); draw(); refreshHeader();
      } else if (state.updated) save();
    } else if (state.updated) save();

  } catch (e) { dbRef = null; }
}

function invade(k) {
  const s = byId(selected); if (!s || cool) return;
  cool = true;
  const m = MENUS[k], before = D[s.id].v, oldLv = D[s.id].L.lv, wasFallen = D[s.id].fallen;
  const oldRank = rankOf(S.pt)[1], oldT = snapshotUnlocked();
  state.log.push({ s: s.id, t: Date.now(), p: m.pt, k: k });
  save(); recompute();
  const d = D[s.id];
  const q = [];
  if (before === 0) { q.push(['制圧', s.name + '、完全制圧！', 'levelup']); }
  else if (d.L.lv > oldLv) q.push(['城郭進化', '【' + d.L.t + '】へ', 'levelup']);
  else if (wasFallen) q.push(['奪還', '治安回復！', 'levelup']);
  else q.push([m.name, '+' + m.pt + ' 内政強化！', 'attack']);
  const newRank = rankOf(S.pt)[1];
  if (newRank !== oldRank) q.push(['昇進', newRank, 'levelup']);
  snapshotUnlocked().forEach((ok, i) => { if (ok && !oldT[i]) q.push(['秘宝獲得', TREASURES[i].name, 'treasure']); });
  playCuts(q);

}

async function scoutGoogle() {
  try {
    const { Place } = await google.maps.importLibrary('places');
    const { places } = await Place.searchByText({
      textQuery: 'マクドナルド', fields: ['id', 'displayName', 'location', 'businessStatus'],
      locationRestriction: G.map.getBounds(), maxResultCount: 20, language: 'ja', region: 'jp'
    });
    let add = 0, fixed = 0, closed = 0;
    (places || []).forEach(pl => {
      const nm = (pl.displayName || '').replace(/マクドナルド|McDonald'?s/gi, '').trim();
      if (!pl.location || !/マクドナルド|McDonald/i.test(pl.displayName || '')) return;
      const lat = pl.location.lat(), lng = pl.location.lng(), [x, y] = toXY(lat, lng);
      if (pl.businessStatus === 'CLOSED_PERMANENTLY') { closed++; return; }
      let hit = state.stores.find(s => s.pid === pl.id);
      if (!hit) hit = state.stores.find(s => { const [a, b] = toXY(s.lat, s.lng); return Math.hypot(a - x, b - y) < 150 && (!nm || s.name.replace(/店$/, '').includes(nm.replace(/店$/, '').slice(0, 2))); });
      if (hit) {
        if (Math.hypot(...(([a, b]) => [a - x, b - y])(toXY(hit.lat, hit.lng))) > 5) fixed++;
        hit.lat = lat; hit.lng = lng; hit.pid = pl.id; return;
      }
      if (state.stores.some(s => { const [a, b] = toXY(s.lat, s.lng); return Math.hypot(a - x, b - y) < 40; })) return;
      state.stores.push({ id: 'g' + pl.id.slice(-12), pid: pl.id, name: nm ? (/店$/.test(nm) ? nm : nm + '店') : '名もなき城', lat, lng }); add++;
    });
    save(); recompute(); draw();
    say('偵察完了：新たに' + add + '城、位置補正' + fixed + '城' + (closed ? '、閉店' + closed + '件は除外' : ''), 'good');
  } catch (e) {
    say('偵察できませんでした。Google CloudでPlaces API (New) を有効にしてください', 'warn');
  }
}

      '</div>' +
      '<div><h3>官位</h3><div class="ranks">' + RANKS.map(r => '<div class="' + (r === cur ? 'cur' : '') + '"><span>' + r[1] + '</span><span>' + r[0].toLocaleString() + ' pt〜</span></div>').join('') + '</div>' +
      (nextR ? '<p class="note" style="margin-top:8px">次の官位【' + nextR[1] + '】まであと ' + (nextR[0] - S.pt).toLocaleString() + ' pt</p>' : '<p class="note" style="margin-top:8px">最高位に到達しました</p>') + '</div>' +
      '<div><h3>城の位階</h3><div class="ranks">' + LEVELS.slice(1).map(l => '<div><span>Lv.' + l.lv + ' ' + l.t + '</span><span>' + l.need + '回 ・ 半径' + l.r.toLocaleString() + 'm</span></div>').join('') + '</div><p class="note" style="margin-top:8px">90日間訪れないと治安が悪化し、支配圏が地図から消えます。再訪すれば即座に回復します。Lv.5は永久不落です。</p></div>';
  } else if (tab === 'month') {
    const now = new Date(), months = [];
    for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({ y: d.getFullYear(), m: d.getMonth(), n: 0, p: 0 }); }
    const mix = { asa: 0, set: 0, gen: 0, cafe: 0 }; const cm = months[5]; const stores = new Set();
    state.log.forEach(e => { const d = new Date(e.t); const mm = months.find(x => x.y === d.getFullYear() && x.m === d.getMonth()); if (mm) { mm.n++; mm.p += e.p; } if (d.getFullYear() === cm.y && d.getMonth() === cm.m) { mix[e.k] = (mix[e.k] || 0) + 1; stores.add(e.s); } });
    const mx = Math.max(1, ...months.map(x => x.n)); const mixMax = Math.max(1, ...Object.values(mix));
    const fav = [...stores].map(id => [id, state.log.filter(e => e.s === id && new Date(e.t).getMonth() === cm.m && new Date(e.t).getFullYear() === cm.y).length]).sort((a, b) => b[1] - a[1])[0];
    body.innerHTML =
      '<div><h3>出陣回数（直近6か月）</h3><div class="months">' + months.map(x => '<div class="mcol"><span>' + x.n + '</span><i style="height:' + Math.round(x.n / mx * 110) + 'px"></i></div>').join('') + '</div>' +
      '<div class="mlabels">' + months.map(x => '<span>' + (x.m + 1) + '月</span>').join('') + '</div></div>' +
      '<div class="kv"><div><span>今月の出陣</span><b>' + cm.n + '回</b></div><div><span>今月の獲得兵力</span><b>' + cm.p.toLocaleString() + '</b></div>' +
      '<div><span>今月訪れた城</span><b>' + stores.size + '</b></div><div><span>今月の本拠地</span><b style="font-size:14px">' + (fav ? esc(byId(fav[0]).name) : '—') + '</b></div></div>' +
      '<div><h3>今月の兵糧内訳</h3><div class="mix">' + Object.keys(MENUS).map(k => '<div class="mix-row"><span>' + MENUS[k].name.replace('新兵器', '').replace('主力部隊', '').replace('パトロール', '') + '</span><div class="bar"><i style="width:' + Math.round(mix[k] / mixMax * 100) + '%"></i></div><span>' + mix[k] + '回</span></div>').join('') + '</div></div>';
  } else if (tab === 'list') {
    const list = state.stores.slice().sort((a, b) => D[b.id].v - D[a.id].v || a.name.localeCompare(b.name, 'ja'));
    body.innerHTML = '<div class="clist">' + list.map(s => {
      const d = D[s.id];
      const st = !d.v ? '未制圧' : d.L.lv >= 5 ? '永久不落' : d.fallen ? '治安悪化 ' + d.days + '日' : '残り' + (GUARD - d.days) + '日';
      return '<button class="crow" data-id="' + esc(s.id) + '"><span class="lv' + (d.v ? '' : ' z') + '">' + (d.v ? 'Lv' + d.L.lv : '空') + '</span><span class="nm"><b>' + esc(s.name) + '</b><small>' + (d.v ? d.L.t + ' ・ 侵攻' + d.v + '回' : '兵糧を選んで制圧') + '</small></span><span class="ct' + (d.fallen || (d.v && d.L.lv < 5 && GUARD - d.days <= 14) ? ' warn' : '') + '">' + st + '</span></button>';
    }).join('') + '</div>';
    body.querySelectorAll('.crow').forEach(b => b.onclick = () => { $('#menu').hidden = true; select(b.dataset.id); });
  } else if (tab === 'treasure') {
    const got = TREASURES.filter(t => t.ok(S)).length;
    body.innerHTML = '<p class="note">' + got + ' / 10 を所蔵</p><div class="treasures">' + TREASURES.map(t => t.ok(S)
      ? '<div class="tr"><b>' + t.name + '</b><p>' + t.desc + '</p><div class="need">' + t.need + '</div></div>'
      : '<div class="tr locked"><b>未発見の秘宝</b><p>条件を満たすと姿を現す。</p><div class="need">' + t.need + '</div></div>').join('') + '</div>';
  } else if (tab === 'data') {
    body.innerHTML =
      '<div><h3>地図</h3><p class="note">現在の地図：<b style="color:var(--paper)">' + mapStatus + '</b>。GoogleマップのAPIキーはこの端末にだけ保存されます。</p><input type="text" id="gk" placeholder="AIza…" autocomplete="off" spellcheck="false" style="margin-top:8px;font-size:12px"><div class="row" style="margin-top:8px"><button class="primary" id="gk-save">保存して再読み込み</button>' + (lsGet(GKEY) ? '<button class="ghost" id="gk-del">キーを削除</button>' : '') + '</div></div>' +
      '<div><h3>保存先</h3><p class="note">現在の保存先：<b style="color:var(--paper)">' + storeMode + '</b>。出陣は記録した瞬間に保存されます。</p></div>' +
      '<div><h3>書き出し</h3><p class="note">別の端末やホーム画面版へ戦歴を引き継ぐときに使います。</p><textarea id="ex" readonly style="min-height:80px;font-size:11px"></textarea><div class="row" style="margin-top:8px"><button class="primary" id="ex-copy">コピー</button><span class="note" id="ex-msg"></span></div></div>' +
      '<div><h3>読み込み</h3><p class="note">書き出した記録を貼り付けて読み込むと、今の戦歴は置き換わります。</p><textarea id="im" placeholder="ここに貼り付け" style="min-height:70px;font-size:11px"></textarea><div class="row" style="margin-top:8px"><button class="ghost" id="im-go">読み込む</button><span class="note" id="im-msg"></span></div></div>' +
      '<div><h3>天下布武やり直し</h3><p class="note">すべての城と戦歴を初期状態に戻します。元に戻せません。</p><div class="row" style="margin-top:8px"><button class="ghost danger" id="rs">' + ['全データを消去する', '本当に消去しますか？', '最終確認：押すと消去'][resetStage] + '</button>' + (resetStage ? '<button class="ghost" id="rs-no">やめる</button>' : '') + '</div></div>';
    $('#ex').value = JSON.stringify(state);
    $('#gk').value = lsGet(GKEY) || '';
    $('#gk-save').onclick = () => { const v = $('#gk').value.trim(); if (!v) return; lsSet(GKEY, v); location.reload(); };
    const gd = $('#gk-del'); if (gd) gd.onclick = () => { try { localStorage.removeItem(GKEY); } catch (e) {} location.reload(); };
    $('#ex-copy').onclick = () => {
      const ta = $('#ex');
      const fall = () => { ta.focus(); ta.select(); $('#ex-msg').textContent = '選択しました。長押しでコピーしてください'; };
      try { navigator.clipboard.writeText(ta.value).then(() => { $('#ex-msg').textContent = 'コピーしました'; }, fall); } catch (e) { fall(); }
    };
    $('#im-go').onclick = () => {
      try {
        const o = JSON.parse($('#im').value);
        if (!valid(o)) throw 0;
        state = o; save(); recompute(); refreshHeader(); closeSheet(); fitAll(false);
        $('#im-msg').textContent = '読み込みました（' + o.stores.length + '城・' + o.log.length + '戦）';
      } catch (e) { $('#im-msg').textContent = '形式が正しくありません。書き出した文字列をそのまま貼り付けてください'; }
    };
    $('#rs').onclick = () => {
      if (resetStage < 2) { resetStage++; renderMenu(); return; }
      state = fresh(); save(); recompute(); refreshHeader(); closeSheet(); resetStage = 0; $('#menu').hidden = true; fitAll(true);
      say('天下布武をやり直しました', 'good');
    };
    const no = $('#rs-no'); if (no) no.onclick = () => { resetStage = 0; renderMenu(); };
  }
}

$('#b-fit').addEventListener('click', () => { sfx('select'); fitAll(true); });

/* ---------- boot ---------- */
recompute();
new ResizeObserver(resize).observe($('#wrap'));
resize(); fitAll(false); refreshHeader();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
setTimeout(connectCloud, 0);
loadGoogle();
})();
</script>

</body>
</html>
