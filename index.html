<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>McDonald's EMPIRES - 7号機</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: #0a0e17; font-family: sans-serif; user-select: none; }
        
        /* マップの高さを100vh（画面の高さ100%）で絶対固定 */
        #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: #1a1f2c; }
        
        /* ダーク戦国マップ変換フィルター */
        .dark-map-tiles {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%) grayscale(20%);
        }

        /* 上部ステータスバー */
        .header {
            position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(0, 0, 0, 0.9);
            color: #d4af37; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #d4af37;
        }
        .title-rank { font-size: 15px; font-weight: bold; }
        .stats { font-size: 12px; color: #fff; text-align: right; }
        .stats span { color: #ffcc00; font-weight: bold; font-size: 14px; }

        /* 稼働モニター（デバッグ＆案内バー） */
        #status-bar {
            position: absolute; top: 58px; left: 0; right: 0; z-index: 1000;
            background: rgba(20, 40, 20, 0.9); color: #00ff88; font-size: 11px;
            text-align: center; padding: 4px; border-bottom: 1px solid #00ff88;
        }

        /* 左上BGMボタン */
        .bgm-btn {
            position: absolute; top: 90px; left: 12px; z-index: 1000;
            background: rgba(15, 15, 15, 0.95); border: 2px solid #d4af37;
            color: #ffd700; padding: 9px 12px; border-radius: 20px;
            font-size: 12px; font-weight: bold; cursor: pointer;
        }

        /* 右側コントロールボタン群 */
        .side-controls {
            position: absolute; top: 90px; right: 12px; z-index: 1000;
            display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
        }
        .ctrl-btn {
            background: rgba(15, 15, 15, 0.95); border: 2px solid #d4af37;
            color: #ffd700; padding: 9px 12px; border-radius: 20px;
            font-size: 12px; font-weight: bold; cursor: pointer;
        }

        /* 下部アクションパネル */
        .bottom-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000;
            width: 92%; max-width: 400px; background: rgba(12, 12, 12, 0.95);
            border: 2px solid #d4af37; border-radius: 12px; padding: 15px;
            color: #fff; display: none; text-align: center;
        }
        .castle-name { font-size: 18px; color: #ffcc00; margin-bottom: 5px; font-weight: bold; }
        .castle-info { font-size: 12px; color: #ccc; margin-bottom: 12px; }
        
        .food-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-attack {
            background: linear-gradient(135deg, #8b0000 0%, #4a0000 100%);
            color: #ffd700; border: 1px solid #d4af37; padding: 12px 6px;
            font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer;
        }
        .btn-attack:disabled { background: #222; color: #666; border-color: #444; }

        /* 軍略メニューモーダル */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); z-index: 3000; display: none;
            justify-content: center; align-items: center;
        }
        .modal-box {
            width: 85%; max-width: 360px; background: #141414; border: 2px solid #d4af37;
            border-radius: 12px; padding: 20px; color: #fff; text-align: center;
        }
        .modal-title { font-size: 18px; color: #ffd700; margin-bottom: 12px; border-bottom: 1px solid #444; padding-bottom: 8px; }
        .modal-body { font-size: 13px; color: #ddd; margin-bottom: 18px; line-height: 1.6; text-align: left; }
        .btn-modal-close { background: #333; color: #fff; border: 1px solid #888; padding: 8px 16px; border-radius: 6px; }
        .btn-modal-reset { background: #800; color: #ffcccc; border: 1px solid #f00; padding: 8px 16px; border-radius: 6px; }

        /* カットイン演出 */
        #cutin {
            position: absolute; top: 40%; left: 0; right: 0; z-index: 2000;
            background: rgba(139,0,0,0.95); color: #ffd700; text-align: center;
            padding: 18px 0; font-size: 22px; font-weight: bold;
            border-top: 2px solid #ffd700; border-bottom: 2px solid #ffd700;
            display: none; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-rank" id="rank-display">【称号】浪人（見習い）</div>
        <div class="stats">制圧: <span id="conquered-count">0</span>城<br>総兵力: <span id="total-pt">0</span></div>
    </div>

    <div id="status-bar">⏳ 戦術マップを起動中...</div>

    <button class="bgm-btn" id="bgm-toggle-btn" onclick="toggleBGM()">🎵 BGM: 停止中</button>

    <div class="side-controls">
        <button class="ctrl-btn" onclick="locateUser()">🎯 現在地へ</button>
        <button class="ctrl-btn" id="scan-btn" onclick="scanAreaStores()">🔍 周辺を偵察</button>
        <button class="ctrl-btn" onclick="openMenu()">📜 軍略メニュー</button>
    </div>

    <!-- 地図本体 -->
    <div id="map"></div>

    <div id="cutin">完全制圧！</div>

    <div id="modal-overlay" onclick="closeMenuDirect()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-title">📜 天下統一・軍略記録</div>
            <div class="modal-body" id="modal-stats-text"></div>
            <div style="display: flex; justify-content: space-between;">
                <button class="btn-modal-close" onclick="closeMenuDirect()">閉じる</button>
                <button class="btn-modal-reset" onclick="confirmReset()">⚠️ 天下布武やり直し</button>
            </div>
        </div>
    </div>

    <div class="bottom-panel" id="panel">
        <div class="castle-name" id="panel-title">拠点名</div>
        <div class="castle-info" id="panel-info">未制圧の拠点</div>
        <div class="food-grid">
            <button class="btn-attack" onclick="invade(150, '朝マック奇襲')">☀️ 朝マック (+150)</button>
            <button class="btn-attack" onclick="invade(100, '主力セット')">🍔 通常セット (+100)</button>
            <button class="btn-attack" onclick="invade(200, '期間限定')">⚔️ 期間限定 (+200)</button>
            <button class="btn-attack" onclick="invade(50, '斥候カフェ')">☕ カフェ (+50)</button>
        </div>
    </div>

    <!-- Leafletスクリプトを最後に読み込むことで確実に描画 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const statusBar = document.getElementById('status-bar');
        window.onerror = function(msg, url, line) {
            statusBar.style.background = '#600';
            statusBar.style.color = '#fff';
            statusBar.innerText = '⚠️ エラー(行:' + line + '): ' + msg;
        };

        // --- 1. サウンド＆BGM ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let bgmInterval = null;
        let isBgmPlaying = false;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                if (type === 'select') {
                    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                    osc.frequency.setValueAtTime(550, now);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now); osc.stop(now + 0.06);
                } else if (type === 'attack') {
                    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(45, now + 0.35);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now); osc.stop(now + 0.35);
                } else if (type === 'levelup') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now + i * 0.07);
                        gain.gain.setValueAtTime(0.18, now + i * 0.07);
                        gain.gain.exponentialRampToValueAtTime(0.008, now + i * 0.07 + 0.45);
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.start(now + i * 0.07); osc.stop(now + i * 0.07 + 0.45);
                    });
                }
                if (navigator.vibrate) navigator.vibrate(type === 'levelup' ? [80, 50, 150] : 40);
            } catch (e) {}
        }

        function toggleBGM() {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const btn = document.getElementById('bgm-toggle-btn');
                if (isBgmPlaying) {
                    clearInterval(bgmInterval);
                    isBgmPlaying = false;
                    btn.innerText = "🎵 BGM: 停止中";
                } else {
                    isBgmPlaying = true;
                    btn.innerText = "🎵 BGM: 再生中";
                    const notes = [110, 110, 164.81, 110, 130.81, 146.83];
                    let step = 0;
                    bgmInterval = setInterval(() => {
                        if (!isBgmPlaying) return;
                        const now = audioCtx.currentTime;
                        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(notes[step % notes.length], now);
                        gain.gain.setValueAtTime(0.07, now);
                        gain.gain.linearRampToValueAtTime(0.001, now + 0.22);
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.start(now); osc.stop(now + 0.22);
                        step++;
                    }, 300);
                }
            } catch (e) {}
        }

        // --- 2. マップ初期化（南船場・心斎橋〜梅田エリアが広く見える位置） ---
        const map = L.map('map', { zoomControl: false }).setView([34.6850, 135.5050], 14);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap', maxZoom: 19, className: 'dark-map-tiles'
        }).addTo(map);

        setTimeout(() => { map.invalidateSize(); }, 300);

        let userMarker = null;
        let isCooldown = false;
        let cutinTimer = null;

        if (!localStorage.getItem('mac_empires_start_date')) {
            localStorage.setItem('mac_empires_start_date', new Date().toLocaleString());
        }

        // 初期店舗リスト（堺筋本町・南船場・長堀橋エリアも最初から搭載！）
        const defaultStores = [
            { id: "m1", name: "天満駅前店", lat: 34.7048, lng: 135.5122, visits: 0, pt: 0 },
            { id: "m2", name: "扇町店", lat: 34.7035, lng: 135.5095, visits: 0, pt: 0 },
            { id: "m3", name: "梅田茶屋町店", lat: 34.7065, lng: 135.4988, visits: 0, pt: 0 },
            { id: "m4", name: "南森町駅前店", lat: 34.6976, lng: 135.5113, visits: 0, pt: 0 },
            { id: "m5", name: "中崎町駅前店", lat: 34.7068, lng: 135.5053, visits: 0, pt: 0 },
            { id: "m6", name: "新梅田店", lat: 34.7032, lng: 135.4965, visits: 0, pt: 0 },
            { id: "m7", name: "ルクア大阪店", lat: 34.7030, lng: 135.4950, visits: 0, pt: 0 },
            { id: "m8", name: "曽根崎お初天神店", lat: 34.7005, lng: 135.5008, visits: 0, pt: 0 },
            { id: "m9", name: "淀屋橋ネクストワン店", lat: 34.6915, lng: 135.5015, visits: 0, pt: 0 },
            { id: "m10", name: "南海難波駅店", lat: 34.6645, lng: 135.5015, visits: 0, pt: 0 },
            { id: "m11", name: "日本橋三丁目店", lat: 34.6628, lng: 135.5056, visits: 0, pt: 0 },
            { id: "m12", name: "道頓堀店", lat: 34.6687, lng: 135.5013, visits: 0, pt: 0 },
            { id: "m13", name: "心斎橋筋店", lat: 34.6715, lng: 135.5012, visits: 0, pt: 0 },
            { id: "m14", name: "鶴橋駅前店", lat: 34.6653, lng: 135.5303, visits: 0, pt: 0 },
            { id: "m15", name: "京橋駅前店", lat: 34.6968, lng: 135.5342, visits: 0, pt: 0 },
            { id: "m16", name: "天王寺北口店", lat: 34.6475, lng: 135.5135, visits: 0, pt: 0 },
            { id: "m17", name: "南久宝寺堺筋店", lat: 34.6801, lng: 135.5061, visits: 0, pt: 0 },
            { id: "m18", name: "本町店", lat: 34.6826, lng: 135.4989, visits: 0, pt: 0 },
            { id: "m19", name: "長堀橋店", lat: 34.6746, lng: 135.5062, visits: 0, pt: 0 },
            { id: "m20", name: "心斎橋北店", lat: 34.6765, lng: 135.5011, visits: 0, pt: 0 }
        ];

        let stores = defaultStores;
        try {
            const saved = JSON.parse(localStorage.getItem('mac_empires_v7'));
            if (saved && Array.isArray(saved)) stores = saved;
        } catch (e) {}

        let selectedStore = null;
        const markers = {};
        const circles = {};

        function getCastleStatus(visits) {
            if (visits === 0) return { lv: 0, title: "未制圧", radius: 0 };
            if (visits < 3)  return { lv: 1, title: "前線陣地", radius: 300 };
            if (visits < 7)  return { lv: 2, title: "監視砦", radius: 500 };
            if (visits < 15) return { lv: 3, title: "要塞都市", radius: 800 };
            if (visits < 30) return { lv: 4, title: "大都督府", radius: 1200 };
            return { lv: 5, title: "覇王の王都（永久不落）", radius: 2000 };
        }

        function renderStores() {
            stores.forEach(store => {
                if (markers[store.id]) return;
                const isConquered = store.visits > 0;
                const marker = L.circleMarker([store.lat, store.lng], {
                    radius: isConquered ? 11 : 9,
                    color: isConquered ? '#ffd700' : '#00ffcc',
                    fillColor: isConquered ? '#ff0000' : '#222222',
                    fillOpacity: 0.95, weight: 3
                }).addTo(map);

                marker.on('click', () => {
                    playSound('select');
                    selectStore(store);
                });
                markers[store.id] = marker;

                if (isConquered) {
                    const status = getCastleStatus(store.visits);
                    circles[store.id] = L.circle([store.lat, store.lng], {
                        color: '#d4af37', weight: 1, fillColor: '#ffcc00', fillOpacity: 0.25, radius: status.radius
                    }).addTo(map);
                }
            });
            updateHeader();
        }

        renderStores();
        statusBar.innerText = "🟢 7号機稼働中：城ピンをタップして侵攻せよ（周辺偵察で店舗追加）";

        function selectStore(store) {
            selectedStore = store;
            const status = getCastleStatus(store.visits);
            document.getElementById('panel').style.display = 'block';
            document.getElementById('panel-title').innerText = "🏯 " + store.name;
            if (store.visits === 0) {
                document.getElementById('panel-info').innerText = "状態：未制圧 ｜ 兵糧を選んで制圧せよ";
            } else {
                document.getElementById('panel-info').innerText = 
                    "Lv." + status.lv + " " + status.title + " (侵攻:" + store.visits + "回 / 半径:" + status.radius + "m)";
            }
            map.panTo([store.lat, store.lng]);
        }

        function invade(points, menuName) {
            if (!selectedStore || isCooldown) return;

            isCooldown = true;
            const buttons = document.querySelectorAll('.btn-attack');
            buttons.forEach(b => b.disabled = true);

            const isFirst = (selectedStore.visits === 0);
            const oldLv = getCastleStatus(selectedStore.visits).lv;

            selectedStore.visits += 1;
            selectedStore.pt += points;
            const newStatus = getCastleStatus(selectedStore.visits);

            localStorage.setItem('mac_empires_v7', JSON.stringify(stores));

            markers[selectedStore.id].setStyle({ color: '#ffd700', fillColor: '#ff0000', radius: 11 });
            if (circles[selectedStore.id]) {
                circles[selectedStore.id].setRadius(newStatus.radius);
            } else {
                circles[selectedStore.id] = L.circle([selectedStore.lat, selectedStore.lng], {
                    color: '#d4af37', weight: 1, fillColor: '#ffcc00', fillOpacity: 0.25, radius: newStatus.radius
                }).addTo(map);
            }

            const cutin = document.getElementById('cutin');
            if (cutinTimer) clearTimeout(cutinTimer);

            if (isFirst) {
                playSound('levelup');
                cutin.innerText = selectedStore.name + "、完全制圧！";
            } else if (newStatus.lv > oldLv) {
                playSound('levelup');
                cutin.innerText = "城郭進化！【" + newStatus.title + "】";
            } else {
                playSound('attack');
                cutin.innerText = menuName + "により内政強化！";
            }
            cutin.style.display = 'block';

            selectStore(selectedStore);
            updateHeader();

            cutinTimer = setTimeout(() => {
                cutin.style.display = 'none';
                isCooldown = false;
                buttons.forEach(b => b.disabled = false);
            }, 1500);
        }

        function updateHeader() {
            const conquered = stores.filter(s => s.visits > 0).length;
            const totalPt = stores.reduce((sum, s) => sum + s.pt, 0);
            document.getElementById('conquered-count').innerText = conquered;
            document.getElementById('total-pt').innerText = totalPt.toLocaleString();

            let rank = "浪人（見習い）";
            if (totalPt >= 500) rank = "足軽大将";
            if (totalPt >= 1500) rank = "一城の主";
            if (totalPt >= 3000) rank = "大阪管領";
            if (totalPt >= 5000) rank = "天下無双の覇王";
            document.getElementById('rank-display').innerText = "【称号】" + rank;
        }

        async function scanAreaStores() {
            const btn = document.getElementById('scan-btn');
            btn.innerText = "⏳ 偵察中...";
            playSound('select');

            const b = map.getBounds();
            const query = `[out:json][timeout:10];(node["name"~"マクドナルド|マクド|McDonald"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});way["name"~"マクドナルド|マクド|McDonald"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}););out center;`;
            
            try {
                const res = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query));
                const data = await res.json();
                let added = 0;

                data.elements.forEach(el => {
                    const lat = el.lat || (el.center && el.center.lat);
                    const lng = el.lon || (el.center && el.center.lon);
                    if (!lat || !lng) return;

                    const exists = stores.some(s => Math.abs(s.lat - lat) < 0.0012 && Math.abs(s.lng - lng) < 0.0012);
                    if (!exists) {
                        let rawName = (el.tags && (el.tags.branch || el.tags.name)) || "発見拠点";
                        rawName = rawName.replace(/マクドナルド|マクド|McDonald's/g, '').trim() || "マクドナル
