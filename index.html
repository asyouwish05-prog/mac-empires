<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EMPIRES">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>McDonald's EMPIRES</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen war table. A lacquer header, a full-bleed ink map with gold territory, a lacquer command sheet that rises from the bottom. */
:root {
  --ink: #0d0c0a;
  --ink-2: #16130f;
  --lacquer: #1b1712;
  --line: #3a3124;
  --gold: #d4af37;
  --gold-hi: #f0d68a;
  --crimson: #a31e1e;
  --crimson-hi: #c7342b;
  --jade: #5cc4a0;
  --paper: #efe6d0;
  --muted: #a69c86;
  --warn: #e98a3a;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
h2, h3, p { margin: 0; }
body { background: var(--ink); color: var(--paper); font-family: var(--font-body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; }

/* header */
.hdr { background: var(--lacquer); border-bottom: 1px solid var(--gold); padding-block: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; z-index: 5; }
.hdr-rank { min-width: 0; }
.hdr-eyebrow { font-size: 10px; letter-spacing: .2em; color: var(--muted); }
.hdr-title { font-family: var(--font-display); font-weight: 800; font-size: 19px; color: var(--gold-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-stats { display: flex; gap: 14px; flex-shrink: 0; }
.stat { text-align: right; }
.stat b { display: block; font-family: var(--font-display); font-size: 20px; color: var(--paper); font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 10px; color: var(--muted); letter-spacing: .12em; }
.ticker { background: var(--ink-2); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); padding-block: 6px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; z-index: 5; }
.ticker.warn { color: var(--warn); }
.ticker.good { color: var(--gold-hi); }

/* map */
.mapwrap { flex: 1; position: relative; min-height: 0; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#gmap { position: absolute; inset: 0; background: var(--ink); }
.g #map { pointer-events: none; }
.tools { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 4; }
.tools.left { right: auto; left: max(12px, env(safe-area-inset-left, 0px)); }
.tool { width: 46px; height: 46px; border-radius: 50%; background: rgba(27,23,18,.92); border: 1px solid var(--gold); color: var(--gold-hi); font-family: var(--font-display); font-weight: 800; font-size: 15px; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.5); position: relative; }
.tool small { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); font-family: var(--font-body); font-weight: 500; font-size: 9px; color: var(--muted); white-space: nowrap; letter-spacing: .05em; text-shadow: 0 1px 3px #000; }
.tool.on { background: var(--crimson); color: #fff; }
.tools .tool + .tool { margin-top: 10px; }

/* bottom sheet */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--lacquer); border-top: 1px solid var(--gold); border-radius: 14px 14px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.6); padding-top: 14px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding-left: var(--gutter-l); padding-right: var(--gutter-r); max-height: 72%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; }
.seal { flex-shrink: 0; width: 46px; height: 46px; border-radius: 6px; background: var(--crimson); color: var(--gold-hi); border: 1px solid var(--gold); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; line-height: 1; text-align: center; }
.seal b { font-size: 20px; display: block; }
.seal i { font-style: normal; font-size: 9px; letter-spacing: .1em; }
.seal.none { background: transparent; border-style: dashed; border-color: var(--jade); color: var(--jade); }
.sheet-name { font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.25; color: var(--paper); text-wrap: balance; }
.sheet-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.sheet-headtext { flex: 1; min-width: 0; }
.x { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 18px; line-height: 1; }
.meter { display: flex; flex-direction: column; gap: 5px; }
.meter-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 8px; }
.meter-row b { color: var(--paper); font-weight: 500; }
.bar { height: 6px; background: var(--ink); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-hi)); }
.guard { font-size: 12px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.guard.ok b { color: var(--gold-hi); }
.guard.soon { border-color: var(--warn); color: var(--warn); }
.guard.fallen { border-color: var(--crimson-hi); color: #ffb3a8; background: rgba(163,30,30,.15); }
.guard.eternal { border-color: var(--gold); color: var(--gold-hi); }
.rations { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ration { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px; border-radius: 8px; background: linear-gradient(160deg, #6e1515, #3d0b0b); border: 1px solid var(--gold); color: var(--paper); min-height: 58px; }
.ration .k { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--gold-hi); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 16px; color: var(--gold-hi); }
.ration span { display: block; font-size: 12px; line-height: 1.3; min-width: 0; }
.ration em { font-style: normal; font-family: var(--font-display); font-weight: 800; color: var(--gold-hi); font-size: 14px; }
.ration.hot { box-shadow: 0 0 0 2px var(--gold-hi); }
.ration:disabled { filter: grayscale(.8) brightness(.6); }
.gate { font-size: 12px; padding: 8px 10px; border-radius: 6px; border: 1px dashed var(--line); color: var(--muted); }
.gate.ok { border-style: solid; border-color: var(--jade); color: var(--jade); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--gold); color: var(--gold-hi); background: rgba(212,175,55,.1); }
.ration .bz { color: var(--jade); }
.day { display: flex; flex-direction: column; gap: 2px; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; padding-bottom: 6px; border-bottom: 1px solid var(--gold); }
.day-head b { font-family: var(--font-display); font-size: 15px; color: var(--gold-hi); }
.day-head span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.day .chips { padding-top: 6px; }
.hrow { display: grid; grid-template-columns: 3.2em minmax(0,1fr) auto auto; column-gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px dotted var(--line); }
.hrow .tm { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hrow .hname { background: none; border: none; padding: 0; text-align: left; font-size: 14px; color: var(--paper); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hrow .hp { font-family: var(--font-display); font-weight: 800; color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.hrow .hsub { grid-column: 2 / 4; font-size: 11px; color: var(--muted); line-height: 1.5; }
.hrow .hsub i { font-style: normal; color: var(--jade); }
.hdel { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 4px; font-size: 11px; padding: 3px 7px; grid-row: 1 / 3; grid-column: 4; }
.hdel.arm { border-color: var(--crimson-hi); color: #ffb3a8; }
.evform { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.evform label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); letter-spacing: .06em; min-width: 0; }
.evform .full { grid-column: 1 / -1; }
.evc { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--lacquer); }
.evc.live { border-color: var(--gold); }
.evc.past { opacity: .72; }
.evc-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.evc-head b { font-family: var(--font-display); font-size: 16px; color: var(--paper); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { flex-shrink: 0; font-size: 10px; letter-spacing: .1em; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.live { background: var(--crimson); border-color: var(--gold); color: var(--gold-hi); }
.pill.up { border-color: var(--jade); color: var(--jade); }
.evc-sub, .evc-stats { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.evc-stats b { color: var(--paper); font-weight: 500; }
.evlist { display: flex; flex-direction: column; gap: 10px; }
.undo { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 8px 10px; border: 1px dashed var(--line); border-radius: 6px; }
.linkbtn { background: none; border: none; color: var(--gold-hi); text-decoration: underline; font-size: 12px; padding: 4px; }
.sect-label { font-size: 10px; letter-spacing: .2em; color: var(--muted); }
textarea, input[type=text], input[type=date], input[type=number], select { width: 100%; background: var(--ink); color: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: inherit; font-size: 14px; -webkit-user-select: text; user-select: text; }
textarea { min-height: 56px; resize: vertical; }
.history { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.history div { display: flex; justify-content: space-between; gap: 8px; }
.sheet-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 7px 12px; font-size: 12px; }
.ghost.danger { border-color: var(--crimson-hi); color: #ffb3a8; }
.primary { background: var(--gold); color: var(--ink); border: none; border-radius: 6px; padding: 9px 16px; font-weight: 700; font-size: 14px; }

/* cut-in */
.cutin { position: absolute; left: 0; right: 0; top: 36%; z-index: 9; pointer-events: none; background: linear-gradient(90deg, rgba(110,15,15,0), rgba(140,20,20,.96) 12%, rgba(140,20,20,.96) 88%, rgba(110,15,15,0)); border-top: 2px solid var(--gold-hi); border-bottom: 2px solid var(--gold-hi); text-align: center; padding: 12px var(--gutter-r) 14px var(--gutter-l); }
.cutin .ey { font-size: 11px; letter-spacing: .4em; color: var(--gold-hi); }
.cutin .tx { font-family: var(--font-display); font-weight: 800; font-size: 26px; color: #fff; text-shadow: 0 2px 0 #000, 0 0 18px rgba(240,214,138,.6); text-wrap: balance; }
.cutin.play { animation: band 1.3s cubic-bezier(.2,.8,.2,1) both; }
@keyframes band { 0% { transform: scaleY(0) skewY(-4deg); opacity: 0; } 12% { transform: scaleY(1.15) skewY(-2deg); opacity: 1; } 22% { transform: scaleY(1) skewY(0); } 85% { opacity: 1; } 100% { opacity: 0; transform: translateX(8%); } }
@media (prefers-reduced-motion: reduce) { .cutin.play { animation: fade 1.3s both; } @keyframes fade { 0%,100% { opacity: 0; } 10%,85% { opacity: 1; } } }

/* menu */
.tour { position: fixed; inset: 0; z-index: 20; }
.tour-ring { position: fixed; border-radius: 50%; border: 2px solid var(--gold-hi); box-shadow: 0 0 0 9999px rgba(0,0,0,.74); transition: all .3s ease; pointer-events: none; }
.tour-card { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); margin-inline: auto; max-width: 440px; background: var(--lacquer); border: 1px solid var(--gold); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
.tour-card h2 { font-family: var(--font-display); font-weight: 800; font-size: 19px; color: var(--gold-hi); text-wrap: balance; }
.tour-card p { font-size: 14px; line-height: 1.7; color: var(--paper); }
.tour-card .note b { color: var(--gold-hi); }
.tour-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tour-dots { display: flex; gap: 5px; }
.tour-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.tour-dots i.on { background: var(--gold-hi); }
@media (prefers-reduced-motion: reduce) { .tour-ring { transition: none; } }
.modal { position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal-card { background: var(--ink); border: 1px solid var(--gold); border-radius: 12px; width: 100%; max-width: 480px; max-height: 100%; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 16px; }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.modal-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 21px; color: var(--gold-hi); text-wrap: balance; }
.modal-eyebrow { font-size: 10px; letter-spacing: .3em; color: var(--muted); }
.law { display: flex; flex-direction: column; gap: 6px; }
.law p, .law li { font-size: 13px; line-height: 1.75; color: var(--paper); }
.law ul { padding-left: 1.2em; margin: 0; display: flex; flex-direction: column; gap: 2px; }
.law b { color: var(--gold-hi); font-weight: 700; }
.ltable { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.ltable th, .ltable td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.ltable th { color: var(--muted); font-weight: 500; font-size: 11px; letter-spacing: .06em; }
.tscroll { overflow-x: auto; }
.delta { font-size: 11px; color: var(--muted); }
.delta.up { color: var(--jade); }
.delta.down { color: var(--warn); }
.menu { position: absolute; inset: 0; z-index: 8; background: var(--ink); display: flex; flex-direction: column; }
.menu-head { display: flex; align-items: center; justify-content: space-between; padding-block: 12px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); border-bottom: 1px solid var(--line); }
.menu-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--gold-hi); }
.tabs { display: flex; gap: 4px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); padding: 10px 12px; font-size: 14px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--gold-hi); border-bottom-color: var(--gold); font-weight: 700; }
.menu-body { flex: 1; overflow-y: auto; padding-block: 16px 32px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); display: flex; flex-direction: column; gap: 18px; }
.menu-body > * { max-width: 640px; width: 100%; margin-inline: auto; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.kv div { background: var(--lacquer); padding: 10px 12px; }
.kv span { display: block; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.kv b { font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; }
h3 { font-family: var(--font-display); font-weight: 800; font-size: 16px; color: var(--gold-hi); margin-bottom: 8px; }
.ranks { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.ranks div { display: flex; justify-content: space-between; color: var(--muted); padding: 4px 0; border-bottom: 1px dotted var(--line); }
.ranks div.cur { color: var(--gold-hi); font-weight: 700; }
.treasures { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.tr { border: 1px solid var(--gold); border-radius: 8px; padding: 10px; background: rgba(212,175,55,.07); min-width: 0; }
.tr b { font-family: var(--font-display); font-size: 14px; color: var(--gold-hi); display: block; }
.tr p { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
.tr .need { font-size: 10px; color: var(--paper); margin-top: 6px; letter-spacing: .05em; }
.tr.locked { border-color: var(--line); background: transparent; }
.tr.locked b { color: var(--muted); }
.months { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 6px; align-items: end; height: 150px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.mcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-variant-numeric: tabular-nums; }
.mcol i { width: 70%; background: linear-gradient(0deg, var(--crimson), var(--crimson-hi)); border-top: 2px solid var(--gold-hi); border-radius: 2px 2px 0 0; min-height: 2px; }
.mcol span { font-size: 11px; color: var(--paper); }
.mlabels { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 6px; text-align: center; font-size: 11px; color: var(--muted); margin-top: 4px; }
.mix { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.mix-row { display: grid; grid-template-columns: 7em 1fr 3em; gap: 8px; align-items: center; }
.mix-row .bar { height: 8px; }
.mix-row span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.clist { display: flex; flex-direction: column; }
.crow { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.crow .lv { font-family: var(--font-display); font-weight: 800; color: var(--gold-hi); font-size: 13px; text-align: center; border: 1px solid var(--gold); border-radius: 4px; padding: 3px 0; }
.crow .lv.z { color: var(--jade); border-color: var(--jade); border-style: dashed; }
.crow .nm { min-width: 0; }
.crow .nm b { display: block; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow .nm small { font-size: 11px; color: var(--muted); }
.crow .ct { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.crow .ct.warn { color: var(--warn); }
.note { font-size: 12px; color: var(--muted); line-height: 1.7; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.empty { font-size: 13px; color: var(--muted); padding: 12px; border: 1px dashed var(--line); border-radius: 8px; text-align: center; }
</style>

<div class="app">
  <header class="hdr">
    <div class="hdr-rank">
      <div class="hdr-eyebrow">官位</div>
      <div class="hdr-title" id="rank">浪人（見習い）</div>
    </div>
    <div class="hdr-stats">
      <div class="stat"><b id="h-cc">0</b><span>制圧城</span></div>
      <div class="stat"><b id="h-pt">0</b><span>総兵力</span></div>
    </div>
  </header>
  <div class="ticker" id="ticker">陣図を読み込み中…</div>

  <div class="mapwrap" id="wrap">
    <div id="gmap" hidden></div>
    <canvas id="map" aria-label="支配圏の地図"></canvas>

    <div class="tools left">

<script>
(function () {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- rules ---------- */
const LEVELS = [
  { lv: 0, need: 0, t: '未制圧', r: 0 },
  { lv: 1, need: 1, t: '前線陣地', r: 300 },
  { lv: 2, need: 3, t: '監視砦', r: 500 },
  { lv: 3, need: 7, t: '要塞都市', r: 800 },
  { lv: 4, need: 15, t: '大都督府', r: 1200 },
  { lv: 5, need: 30, t: '覇王の王都', r: 2000 }
];
const lvOf = v => { let L = LEVELS[0]; for (const l of LEVELS) if (v >= l.need) L = l; return L; };
const MENUS = {
  asa: { pt: 150, name: '朝マック奇襲', k: '朝' },
  set: { pt: 100, name: '通常セット主力部隊', k: '主' },
  gen: { pt: 200, name: '期間限定新兵器', k: '新' },
  cafe: { pt: 50, name: '斥候カフェパトロール', k: '茶' }
};
const RANKS = [[0, '浪人（見習い）'], [500, '足軽大将'], [1500, '一城の主'], [3000, '大阪管領'], [5000, '天下無双の覇王']];
const rankOf = p => { let r = RANKS[0]; for (const x of RANKS) if (p >= x[0]) r = x; return r; };
const GUARD = 90, DAY = 864e5;
const TREASURES = [
  { name: '黄金のビッグマック像', desc: '輝く純金のパティが士気を高める。', need: '総兵力 300', ok: S => S.pt >= 300 },
  { name: '覇王のポテトホルダー', desc: '揚げたての熱を永遠に保つ魔導具。', need: '総兵力 1,000', ok: S => S.pt >= 1000 },
  { name: '秘伝のマックカフェの壺', desc: '極上の香りで全軍の疲労を癒す。', need: '総兵力 2,500', ok: S => S.pt >= 2500 },
  { name: '黄金のゴールデンアーチ旗', desc: '天下統一の覇者のみが掲げられる至宝。', need: '総兵力 5,000', ok: S => S.pt >= 5000 },
  { name: '暁の軍配', desc: '夜明けとともに攻め入る者の采配。', need: '朝マック奇襲 10回', ok: S => S.k.asa >= 10 },
  { name: '新兵器の設計図', desc: '季節ごとに書き換わる門外不出の図面。', need: '期間限定 10回', ok: S => S.k.gen >= 10 },
  { name: '斥候の銀の匙', desc: '一杯の珈琲で敵情を探る隠密の道具。', need: 'カフェ 20回', ok: S => S.k.cafe >= 20 },
  { name: '十城連判状', desc: '十の城主が名を連ねた同盟の証文。', need: '10城を制圧', ok: S => S.cc >= 10 },
  { name: '百戦錬磨の陣羽織', desc: '百度の出陣を経ても色褪せぬ一着。', need: '総侵攻 100回', ok: S => S.tv >= 100 },
  { name: '王都の玉璽', desc: '覇王の王都を築いた者だけが押せる印。', need: 'Lv.5の城を1つ', ok: S => S.lv5 >= 1 }
];
const DISTRICTS = [
  ['梅田', 34.7025, 135.4959], ['天満', 34.7046, 135.5120], ['京橋', 34.6966, 135.5340], ['淀屋橋', 34.6920, 135.5010],
  ['本町', 34.6823, 135.5000], ['大阪城', 34.6873, 135.5262], ['心斎橋', 34.6750, 135.5010], ['難波', 34.6660, 135.5010],
  ['鶴橋', 34.6655, 135.5300], ['天王寺', 34.6460, 135.5135]
];
const DEF_STORES = [
  ['m1','天満駅前店',34.7048,135.5122],['m2','扇町店',34.7035,135.5095],['m3','梅田茶屋町店',34.7065,135.4988],['m4','南森町駅前店',34.6976,135.5113],
  ['m5','中崎町駅前店',34.7068,135.5053],['m6','新梅田店',34.7032,135.4965],['m7','ルクア大阪店',34.7030,135.4950],['m8','曽根崎お初天神店',34.7005,135.5008],
  ['m9','淀屋橋ネクストワン店',34.6915,135.5015],['m10','南海難波駅店',34.6645,135.5015],['m11','日本橋三丁目店',34.6628,135.5056],['m12','道頓堀店',34.6687,135.5013],
  ['m13','心斎橋筋店',34.6715,135.5012],['m14','鶴橋駅前店',34.6653,135.5303],['m15','京橋駅前店',34.6968,135.5342],['m16','天王寺北口店',34.6475,135.5135],
  ['m17','南久宝寺堺筋店',34.6801,135.5061],['m18','本町店',34.6826,135.4989],['m19','長堀橋店',34.6746,135.5062],['m20','心斎橋北店',34.6765,135.5011]
].map(a => ({ id: a[0], name: a[1], lat: a[2], lng: a[3] }));

/* ---------- state & storage ---------- */
const KEY = 'mce_v2';
const fresh = () => ({ v: 2, start: Date.now(), updated: 0, stores: DEF_STORES.map(s => ({ ...s })), log: [], events: [] });
const norm = o => { if (!Array.isArray(o.events)) o.events = []; return o; };
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function valid(o) { return o && Array.isArray(o.stores) && Array.isArray(o.log); }
function loadLocal() {
  try { const o = JSON.parse(lsGet(KEY)); if (valid(o)) return o; } catch (e) {}
  // migrate the earlier Leaflet build (mac_v12) if it lives on the same origin
  try {
    const old = JSON.parse(lsGet('mac_v12'));
    if (Array.isArray(old) && old.length) {
      const st = Date.parse(lsGet('mac_start') || '') || Date.now();
      const o = fresh(); o.start = st; o.stores = []; o.log = [];
      old.forEach(s => {
        o.stores.push({ id: s.id, name: s.name, lat: s.lat, lng: s.lng });
        const per = s.visits ? Math.round((s.pt || 0) / s.visits) : 0;
        for (let i = 0; i < (s.visits || 0); i++) o.log.push({ s: s.id, t: st, p: per, k: 'set' });
      });
      return o;
    }
  } catch (e) {}
  return null;
}
let state = norm(loadLocal() || fresh());
let dbRef = null, writing = Promise.resolve(), saveTimer = null, storeMode = 'この端末';

function save() {
  state.updated = Date.now();
  const json = JSON.stringify(state);
  lsSet(KEY, json);
  if (window.EMP_WAR) EMP_WAR.onSave();
  if (!dbRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const body = { json: JSON.stringify(state), updated: state.updated };
    writing = writing.then(() => dbRef.set(body)).catch(err => {
      if (err && err.code === 'unavailable') return new Promise(r => setTimeout(r, 800 + Math.random() * 800)).then(() => dbRef.set(body)).catch(() => {});
      if (err && err.code === 'quota_exceeded') say('記録の保存容量が上限です。記録管理から古いデータを書き出してください', 'warn');
    });
  }, 500);
}

async function connectCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    dbRef = db.doc('data/users/' + id + '/empire');
    const snap = await dbRef.get();
    if (snap.exists) {
      let remote = null;
      try { remote = JSON.parse(snap.data().json); } catch (e) {}
      if (valid(remote) && (remote.updated || 0) >= (state.updated || 0)) {
        state = norm(remote); lsSet(KEY, JSON.stringify(state)); recompute(); draw(); refreshHeader();
      } else if (state.updated) save();
    } else if (state.updated) save();
    storeMode = 'クラウド（あなた専用）';
  } catch (e) { dbRef = null; }
}

/* ---------- derived ---------- */
const totalOf = e => e.p + (e.bx || 0);
let D = {}, S = null;
function recompute() {
  D = {};
  state.stores.forEach(s => { D[s.id] = { v: 0, p: 0, last: 0 }; });
  const k = { asa: 0, set: 0, gen: 0, cafe: 0 };
  let pt = 0, tv = 0;
  state.log.forEach(e => {
    const d = D[e.s]; if (!d) return;
    d.v++; d.p += totalOf(e); if (e.t > d.last) d.last = e.t;
    pt += totalOf(e); tv++; if (k[e.k] != null) k[e.k]++;
  });
  let cc = 0, lv5 = 0, fallen = 0, soon = 0;
  state.stores.forEach(s => {
    const d = D[s.id], L = lvOf(d.v); d.L = L;
    d.days = d.v ? Math.floor((Date.now() - d.last) / DAY) : 0;
    d.fallen = d.v > 0 && L.lv < 5 && d.days >= GUARD;
    if (d.v) cc++; if (L.lv >= 5) lv5++; if (d.fallen) fallen++;
    else if (d.v && L.lv < 5 && GUARD - d.days <= 14) soon++;
  });
  S = { pt, tv, cc, lv5, k, fallen, soon };
}

/* ---------- map projection ---------- */
const LAT0 = 34.68, LNG0 = 135.50;
const KX = 111320 * Math.cos(LAT0 * Math.PI / 180), KY = 110540;
const toXY = (lat, lng) => [(lng - LNG0) * KX, -(lat - LAT0) * KY];
const toLL = (x, y) => [LAT0 - y / KY, LNG0 + x / KX];
const cv = $('#map'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const view = { cx: 0, cy: 0, s: 0.08 };
let selected = null, me = null, buildMode = false, moveId = null, G = null;
const terr = document.createElement('canvas'), tctx = terr.getContext('2d');
const ring = document.createElement('canvas'), rctx = ring.getContext('2d');

function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = r.width; H = r.height;
  [cv, terr, ring].forEach(c => { c.width = Math.max(1, Math.round(W * DPR)); c.height = Math.max(1, Math.round(H * DPR)); });
  draw();
}
const sx = x => W / 2 + (x - view.cx) * view.s;
const sy = y => H / 2 + (y - view.cy) * view.s;
const wx = px => view.cx + (px - W / 2) / view.s;
const wy = py => view.cy + (py - H / 2) / view.s;

function fitAll(animate) {
  if (G) {
    const b = new google.maps.LatLngBounds();
    state.stores.forEach(s => b.extend({ lat: s.lat, lng: s.lng })); if (me) b.extend({ lat: me.lat, lng: me.lng });
    if (!b.isEmpty()) G.map.fitBounds(b, 40); return;
  }
  const pts = state.stores.map(s => toXY(s.lat, s.lng));
  if (me) pts.push(toXY(me.lat, me.lng));
  if (!pts.length) return;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  pts.forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); });
  const pad = 600;
  const s = Math.min((W || 360) / (x1 - x0 + pad * 2), (H || 500) / (y1 - y0 + pad * 2));
  flyTo((x0 + x1) / 2, (y0 + y1) / 2, clampS(s), animate);
}
const clampS = s => Math.max(0.004, Math.min(2.5, s));
let flyRAF = 0;
function flyTo(cx, cy, s, animate) {
  cancelAnimationFrame(flyRAF);
  if (!animate || matchMedia('(prefers-reduced-motion: reduce)').matches) { view.cx = cx; view.cy = cy; view.s = s; draw(); return; }
  const a = { ...view }, t0 = performance.now(), dur = 380;
  const step = now => {
    const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
    view.cx = a.cx + (cx - a.cx) * e; view.cy = a.cy + (cy - a.cy) * e;
    view.s = Math.exp(Math.log(a.s) + (Math.log(s) - Math.log(a.s)) * e);
    draw(); if (t < 1) flyRAF = requestAnimationFrame(step);
  };
  flyRAF = requestAnimationFrame(step);
}
function focusStore(s) {
  if (G) {
    const sh = Math.min(H * 0.62, 420);
    if (G.map.getZoom() < 15) G.map.setZoom(15);
    G.map.panTo({ lat: s.lat, lng: s.lng }); setTimeout(() => G.map.panBy(0, sh / 2), 60); return;
  }
  const [x, y] = toXY(s.lat, s.lng);
  const sheetH = Math.min(H * 0.62, 420);
  const targetS = Math.max(view.s, 0.12);
  // place the castle in the visible band above the sheet
  const offsetPx = (H / 2) - (H - sheetH) / 2;
  flyTo(x, y + offsetPx / targetS, targetS, true);
}

/* ---------- drawing ---------- */
let drawQueued = false;
function draw() { if (drawQueued) return; drawQueued = true; requestAnimationFrame(paint); }
function P(lat, lng) {
  if (G) {
    const pr = G.ov.getProjection(); if (!pr) return [-9999, -9999];
    const q = pr.fromLatLngToContainerPixel(new google.maps.LatLng(lat, lng)); return [q.x, q.y];
  }
  const [x, y] = toXY(lat, lng); return [sx(x), sy(y)];
}
function pxPerMeter() {
  if (!G) return view.s;
  const c = G.map.getCenter(); if (!c) return 0.1;
  const a = P(c.lat(), c.lng()), b = P(c.lat(), c.lng() + 1000 / KX);
  return Math.hypot(b[0] - a[0], b[1] - a[1]) / 1000;
}
const fontVar = n => getComputedStyle(document.documentElement).getPropertyValue(n);
function paint() {
  drawQueued = false;
  if (!W) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const ppm = pxPerMeter();
  const steps = [100, 250, 500, 1000, 2000, 5000, 10000, 20000];
  if (G) ctx.clearRect(0, 0, W, H);
  else {
    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.8);
    g.addColorStop(0, '#17140f'); g.addColorStop(1, '#0b0a08');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const step = steps.find(st => st * view.s >= 64) || 20000;
    ctx.strokeStyle = 'rgba(212,175,55,0.07)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = Math.floor(wx(0) / step) * step; x <= wx(W); x += step) { const p = Math.round(sx(x)) + .5; ctx.moveTo(p, 0); ctx.lineTo(p, H); }
    for (let y = Math.floor(wy(0) / step) * step; y <= wy(H); y += step) { const p = Math.round(sy(y)) + .5; ctx.moveTo(0, p); ctx.lineTo(W, p); }
    ctx.stroke();
    if (view.s > 0.02) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const fs = Math.max(13, Math.min(30, view.s * 180));
      ctx.font = '800 ' + fs + 'px ' + fontVar('--font-display');
      ctx.fillStyle = 'rgba(239,230,208,0.09)';
      DISTRICTS.forEach(([n, la, lo]) => { const [px, py] = P(la, lo); ctx.fillText(n.split('').join(' '), px, py); });
    }
  }

  // territory: union of circles
  const live = state.stores.filter(s => D[s.id] && D[s.id].v && !D[s.id].fallen && !(window.EMP_WAR && EMP_WAR.blocked(s.id)));
  tctx.setTransform(DPR, 0, 0, DPR, 0, 0); tctx.clearRect(0, 0, W, H);
  rctx.setTransform(DPR, 0, 0, DPR, 0, 0); rctx.clearRect(0, 0, W, H);
  if (live.length) {
    tctx.fillStyle = '#d4af37'; tctx.beginPath();
    rctx.fillStyle = '#f0d68a'; rctx.beginPath();
    live.forEach(s => { const [px, py] = P(s.lat, s.lng), r = D[s.id].L.r * ppm; tctx.moveTo(px + r, py); tctx.arc(px, py, r, 0, Math.PI * 2); rctx.moveTo(px + r + 1.6, py); rctx.arc(px, py, r + 1.6, 0, Math.PI * 2); });
    tctx.fill(); rctx.fill();
    rctx.globalCompositeOperation = 'destination-out'; rctx.drawImage(terr, 0, 0, W, H); rctx.globalCompositeOperation = 'source-over';
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = G ? 0.22 : 0.17; ctx.drawImage(terr, 0, 0);
    ctx.globalAlpha = 0.85; ctx.drawImage(ring, 0, 0);
    ctx.restore();
    ctx.strokeStyle = 'rgba(240,214,138,0.35)'; ctx.setLineDash([2, 4]); ctx.lineWidth = 1;
    live.forEach(s => { if (D[s.id].L.lv >= 5) { const [px, py] = P(s.lat, s.lng); ctx.beginPath(); ctx.arc(px, py, D[s.id].L.r * ppm * 0.6, 0, Math.PI * 2); ctx.stroke(); } });
    ctx.setLineDash([]);
  }
  state.stores.forEach(s => {
    const d = D[s.id]; if (!d || !d.fallen) return;
    const [px, py] = P(s.lat, s.lng);
    ctx.setLineDash([6, 5]); ctx.strokeStyle = 'rgba(199,52,43,0.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(px, py, d.L.r * ppm, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  });

  if (window.EMP_WAR) { try { EMP_WAR.paint(ctx, P, ppm); } catch (e) {} }
  if (me) {
    const [px, py] = P(me.lat, me.lng);
    const acc = Math.max(8, (me.acc || 30) * ppm);
    ctx.fillStyle = 'rgba(90,160,255,0.14)'; ctx.beginPath(); ctx.arc(px, py, acc, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4a90ff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  const order = state.stores.slice().sort((a, b) => (D[a.id].v - D[b.id].v));
  const fontD = fontVar('--font-display'), fontB = fontVar('--font-body');
  order.forEach(s => {
    const d = D[s.id], [px, py] = P(s.lat, s.lng);
    if (px < -40 || py < -40 || px > W + 40 || py > H + 40) return;
    const r = pinR(s);
    if (selected === s.id || moveId === s.id) {
      ctx.strokeStyle = moveId === s.id ? '#5cc4a0' : '#f0d68a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py, r + 7, 0, Math.PI * 2); ctx.stroke();
    }
    if (d.v) {
      ctx.fillStyle = d.fallen ? '#4a1414' : '#a31e1e'; ctx.strokeStyle = d.fallen ? '#c7342b' : '#f0d68a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px, py - r); ctx.lineTo(px + r, py); ctx.lineTo(px, py + r); ctx.lineTo(px - r, py); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f0d68a'; ctx.font = '800 ' + Math.round(r * 0.95) + 'px ' + fontD;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(d.L.lv), px, py + 1);
    } else {
      ctx.fillStyle = 'rgba(13,12,10,0.9)'; ctx.strokeStyle = '#5cc4a0'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

function snapshotUnlocked() { return TREASURES.map(t => t.ok(S)); }
function invade(k) {
  const s = byId(selected); if (!s || cool || !gate(s).ok) return;
  cool = true;
  const m = MENUS[k], before = D[s.id].v, oldLv = D[s.id].L.lv, wasFallen = D[s.id].fallen;
  const oldRank = rankOf(S.pt)[1], oldT = snapshotUnlocked();
  const bn = bonusFor(s, k), bx = bn.reduce((a, b) => a + b[1], 0);
  const goals = activeEvents(dayKey(Date.now())).filter(ev => ev.goal).map(ev => [ev, eventStats(ev).st]);
  const entry = { s: s.id, t: Date.now(), p: m.pt, k: k }; if (bx) { entry.bx = bx; entry.bn = bn; }
  state.log.push(entry);
  save(); recompute();
  const d = D[s.id];
  const q = [];
  if (before === 0) { q.push(['制圧', s.name + '、完全制圧！', 'levelup']); }
  else if (d.L.lv > oldLv) q.push(['城郭進化', '【' + d.L.t + '】へ', 'levelup']);
  else if (wasFallen) q.push(['奪還', '治安回復！', 'levelup']);
  else q.push([m.name, '+' + m.pt + ' 内政強化！', 'attack']);
  if (bx) q.push(['ボーナス +' + bx, bn.map(b => b[0]).join('・'), 'attack']);
  goals.forEach(([ev, st]) => { if (st < ev.goal && eventStats(ev).st >= ev.goal) q.push(['イベント達成', ev.name, 'treasure']); });
  const newRank = rankOf(S.pt)[1];
  if (newRank !== oldRank) q.push(['昇進', newRank, 'levelup']);
  snapshotUnlocked().forEach((ok, i) => { if (ok && !oldT[i]) q.push(['秘宝獲得', TREASURES[i].name, 'treasure']); });
  playCuts(q);
  undoUntil = Date.now() + 15000; clearTimeout(undoTimer); undoTimer = setTimeout(() => { if (selected) renderSheet(); }, 15100);
  renderSheet(); refreshHeader(); draw();
  setTimeout(() => { cool = false; updateGate(); }, 1200);
}
function undo() {
  const e = state.log[state.log.length - 1];
  if (!e || Date.now() > undoUntil) return;
  state.log.pop(); undoUntil = 0; save(); recompute(); refreshHeader(); renderSheet(); draw();
  say('直前の出陣を取り消しました', 'good');
}

/* ---------- GPS, auto lock-on & check-in range ---------- */
const CHECKIN_M = 30, LOCK_M = 80, STALE_MS = 120000;
let watchId = null, lastLock = null, geoState = 'off', panOnFix = false;
const fmtDist = d => d >= 1000 ? (d / 1000).toFixed(1) + 'km' : Math.round(d) + 'm';
function distTo(s) { if (!me) return Infinity; const [a, b] = toXY(me.lat, me.lng), [x, y] = toXY(s.lat, s.lng); return Math.hypot(x - a, y - b); }
function gate(s) {
  if (geoState === 'denied') return { ok: false, msg: window.claude ? 'この画面では位置情報が使えません。ホーム画面版（GitHub Pages）で出陣してください' : '位置情報が許可されていません。端末の設定でこのサイトの位置情報をオンにしてください' };
  if (geoState === 'none') return { ok: false, msg: 'この画面では位置情報が使えないため出陣できません' };
  if (!me || Date.now() - me.t > STALE_MS) return { ok: false, msg: '現在地を測位中…' };
  const d = distTo(s), tol = Math.min(me.acc || 0, 20);
  if (d - tol <= CHECKIN_M) return { ok: true, msg: '射程内（' + fmtDist(d) + '）。兵糧を選んで出陣せよ' };
  return { ok: false, msg: '城まで' + fmtDist(d) + '。' + CHECKIN_M + 'm以内に近づくと出陣できます' + (me.acc > 40 ? '（測位精度 ±' + Math.round(me.acc) + 'm）' : '') };
}
function updateGate() {
  const s = byId(selected), el = $('#sh-gate'); if (!s || !el) return;
  const g = gate(s);
  el.textContent = g.msg; el.className = 'gate' + (g.ok ? ' ok' : '');
  sheet.querySelectorAll('.ration').forEach(b => { b.disabled = cool || !g.ok; });
}
function startGeo() {
  if (!navigator.geolocation) { geoState = 'none'; updateGate(); return; }
  if (watchId != null) return;
  geoState = 'waiting';
  watchId = navigator.geolocation.watchPosition(p => {
    geoState = 'ok';
    me = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
    if (panOnFix) {
      panOnFix = false;
      if (G) { G.map.panTo({ lat: me.lat, lng: me.lng }); if (G.map.getZoom() < 16) G.map.setZoom(16); }
      else { const [x, y] = toXY(me.lat, me.lng); flyTo(x, y, Math.max(view.s, 0.25), true); }
      const n = nearest(); if (n && n.dist > LOCK_M) say('最寄りの城：' + n.s.name + '（' + fmtDist(n.dist) + '）', 'good');
    }
    const near = nearest();
    if (near && near.dist <= LOCK_M && lastLock !== near.s.id && !buildMode && !moveId) {
      lastLock = near.s.id; sfx('levelup'); select(near.s.id);
      say('ロックオン：' + near.s.name + '（' + fmtDist(near.dist) + '）', 'good');
    }
    if (near && near.dist > LOCK_M * 2) lastLock = null;
    updateGate(); draw();
  }, err => {
    if (err && err.code === 1) { geoState = 'denied'; navigator.geolocation.clearWatch(watchId); watchId = null; }
    else if (geoState !== 'ok') geoState = 'waiting';
    if (panOnFix) { panOnFix = false; say(err && err.code === 1 ? '位置情報が許可されていません。端末の設定でオンにしてください' : '現在地を取得できませんでした', 'warn'); }
    updateGate();
  }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
}
$('#b-loc').addEventListener('click', () => {
  sfx('select');
  if (geoState === 'denied') { watchId = null; geoState = 'off'; }
  if (me && Date.now() - me.t < STALE_MS) { startGeo();
    if (G) { G.map.panTo({ lat: me.lat, lng: me.lng }); if (G.map.getZoom() < 16) G.map.setZoom(16); }
    else { const [x, y] = toXY(me.lat, me.lng); flyTo(x, y, Math.max(view.s, 0.25), true); }
    return;
  }
  say('現在地を特定中…', 'good'); panOnFix = true; startGeo();
});
setInterval(updateGate, 15000);
function nearest() {
  if (!me) return null; let best = null;
  state.stores.forEach(s => { const d = distTo(s); if (!best || d < best.dist) best = { s, dist: d }; });
  return best;
}

$('#b-scan').addEventListener('click', () => {

  const [la0, lo0] = toLL(wx(0), wy(H)), [la1, lo1] = toLL(wx(W), wy(0));

  const bx = [la0, lo0, la1, lo1].map(v => v.toFixed(5)).join(',');
  const q = '[out:json][timeout:10];(nwr["brand:wikidata"="Q38076"](' + bx + ');nwr[amenity=fast_food][name~"マクドナルド|McDonald"](' + bx + '););out center;';
  fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(q)).then(r => r.json()).then(dt => {
    let add = 0;
    (dt.elements || []).forEach(el => {
      const t = el.tags || {}, lat = el.lat || (el.center && el.center.lat), lng = el.lon || (el.center && el.center.lon);
      if (!lat || !lng) return;
      const [x, y] = toXY(lat, lng);
      if (state.stores.some(s => { const [a, b] = toXY(s.lat, s.lng); return Math.hypot(a - x, b - y) < 90; })) return;

    });

  }).catch(() => say('この画面からは偵察できません。ホーム画面版で使うか、築城で手動追加してください', 'warn'));

async function scoutGoogle() {
  try {
    const { Place } = await google.maps.importLibrary('places');
    const { places } = await Place.searchByText({
      textQuery: 'マクドナルド', fields: ['id', 'displayName', 'location', 'businessStatus'],
      locationRestriction: G.map.getBounds(), maxResultCount: 20, language: 'ja', region: 'jp'
    });
    let add = 0, fixed = 0, closed = 0;
    (places || []).forEach(pl => {
      const nm = (pl.displayName || '').replace(/マクドナルド|McDonald'?s/gi, '').trim();
      if (!pl.location || !/マクドナルド|McDonald/i.test(pl.displayName || '')) return;
      const lat = pl.location.lat(), lng = pl.location.lng(), [x, y] = toXY(lat, lng);
      if (pl.businessStatus === 'CLOSED_PERMANENTLY') { closed++; return; }
      let hit = state.stores.find(s => s.pid === pl.id);
      if (!hit) hit = state.stores.find(s => { const [a, b] = toXY(s.lat, s.lng); return Math.hypot(a - x, b - y) < 150 && (!nm || s.name.replace(/店$/, '').includes(nm.replace(/店$/, '').slice(0, 2))); });
      if (hit) {
        if (Math.hypot(...(([a, b]) => [a - x, b - y])(toXY(hit.lat, hit.lng))) > 5) fixed++;
        hit.lat = lat; hit.lng = lng; hit.pid = pl.id; shareStore(hit); return;
      }
      if (state.stores.some(s => { const [a, b] = toXY(s.lat, s.lng); return Math.hypot(a - x, b - y) < 40; })) return;
      const ns = { id: 'g' + pl.id.slice(-12), pid: pl.id, name: nm ? (/店$/.test(nm) ? nm : nm + '店') : '名もなき城', lat, lng }; state.stores.push(ns); shareStore(ns); add++;
    });
    save(); recompute(); draw();
    say('偵察完了：新たに' + add + '城、位置補正' + fixed + '城' + (closed ? '、閉店' + closed + '件は除外' : ''), 'good');
  } catch (e) {
    say('偵察できませんでした。Google CloudでPlaces API (New) を有効にしてください', 'warn');
  }
}

/* ---------- formation (overlapping territory) ---------- */
function formationOf(list) {
  // list: [{lat, lng, r}] — a castle is linked when its territory overlaps another of the same army
  let linked = 0;
  const pts = list.map(c => { const [x, y] = toXY(c.lat, c.lng); return [x, y, c.r]; });
  pts.forEach((a, i) => { if (pts.some((b, j) => j !== i && Math.hypot(a[0] - b[0], a[1] - b[1]) < a[2] + b[2])) linked++; });
  return { linked, buff: Math.min(0.5, linked * 0.05) };
}
function formation() {
  return formationOf(state.stores.filter(s => D[s.id] && D[s.id].v && !D[s.id].fallen && !(window.EMP_WAR && EMP_WAR.blocked(s.id))).map(s => ({ lat: s.lat, lng: s.lng, r: D[s.id].L.r })));
}

  card.style.bottom = low ? 'calc(24px + env(safe-area-inset-bottom, 0px))' : 'auto';

    '<div class="tour-foot"><div class="tour-dots">' + TOUR.map((_, i) => '<i class="' + (i === tourI ? 'on' : '') + '"></i>').join('') + '</div>' +
    '<div class="row">' + (tourI < TOUR.length - 1 ? '<button class="ghost" id="tour-skip">閉じる</button>' : '') + (tourI ? '<button class="ghost" id="tour-back">戻る</button>' : '') +
    '<button class="primary" id="tour-next">' + (tourI < TOUR.length - 1 ? '次へ' : '出陣する') + '</button></div></div>';
  $('#tour-next').onclick = () => { sfx('select'); if (tourI < TOUR.length - 1) { tourI++; showTourStep(); } else endTour(); };
  const bk = $('#tour-back'); if (bk) bk.onclick = () => { sfx('select'); tourI--; showTourStep(); };
  const sk = $('#tour-skip'); if (sk) sk.onclick = () => { sfx('select'); endTour(); };
}

/* ---------- 軍法 (rules summary) ---------- */

    '<section class="law"><h3>序、インテグリティ</h3><p>行ってなくてもボタン押せるので、<b>ズルはなしね</b>。出陣は実際に店に行って注文したときだけ。頼んでいない兵糧を選ぶのもなし。<b>インテグリティ</b>をもって対応しましょう。</p></section>' +
    '<section class="law"><h3>一、出陣</h3><ul><li>店の<b>30m以内</b>で城を開き、注文した兵糧を選ぶと出陣（チェックイン）になります。</li><li>店から80m以内に入ると、その城が自動で選ばれます。</li><li>誤って出陣したときは15秒以内なら「取り消す」、それ以降は戦歴タブで削除できます。</li></ul>' +
      tbl(['兵糧', '兵力'], Object.keys(MENUS).map(k => [MENUS[k].name, '+' + MENUS[k].pt])) + '</section>' +
    '<section class="law"><h3>二、城の位階</h3><p>同じ城に通うほど城が育ち、支配圏（円）が広がります。</p>' +
      tbl(['位階', '必要な出陣', '支配半径'], LEVELS.slice(1).map(l => ['Lv.' + l.lv + ' ' + l.t, l.need + '回', l.r.toLocaleString() + 'm'])) +
      '<ul><li><b>治安維持</b>：90日間訪れないと治安が悪化し、支配圏が消えます。再訪すれば回復します。</li><li>Lv.5「覇王の王都」は永久不落で、防衛期限がありません。</li></ul></section>' +
    '<section class="law"><h3>三、ボーナス</h3><ul>' +
      '<li><b>連戦</b>：同じ日に別の城を制圧すると、2城目+50、3城目+100、4城目以降+150。</li>' +
      '<li><b>連日出陣</b>：3日以上続けて出陣すると、その日の最初の出陣に+50（5日以上は+100）。</li>' +
      '<li><b>イベント</b>：自分で作ったイベントの期間中は、兵力×1.5／×2／×3／毎回+100のいずれか。</li>' +
      '<li><b>陣形</b>：支配圏が重なる自軍の城は「連携城」。1城につき戦力+5%（上限+50%）。合戦イベントの戦力に掛かります。</li></ul></section>' +
    '<section class="law"><h3>四、官位と秘宝</h3>' + tbl(['官位', '総兵力'], RANKS.map(r => [r[1], r[0].toLocaleString() + 'pt〜'])) +
      '<p>十大秘宝は兵力や出陣回数などの条件を満たすと解放されます（十大秘宝タブで条件を確認できます）。</p></section>' +
    '<section class="law"><h3>五、合戦（仲間との対戦）</h3><ul>' +
      '<li><b>城主</b>：直近90日の出陣回数が一番多い軍がその城の城主です。</li>' +
      '<li><b>同数のとき</b>：先にその城を制圧した軍が城主のままです。</li>' +
      '<li><b>落城</b>：他の軍に回数で追い抜かれると落城します。留守の間に城が動いた場合は、次にアプリを開いたときに知らせます。</li>' +
      '<li><b>表示</b>：自軍の領土は金、他の軍は軍旗の色。敵の城には旗が立ちます。</li>' +
      '<li><b>仲間の手伝い</b>：築城・店名の修正・位置の修正・閉店した城の削除は、仲間全員の地図に反映されます。</li>' +

      '<li><b>賞品</b>：勝者は戦利品（お宝）を得ます。「城の奪取あり」の合戦では、敗れた各軍から1城ずつ（勝者との回数差が一番小さい城）を奪い、30日間は回数に関係なく勝者の城になります。</li>' +

}

/* ---------- monthly report ---------- */
const monthKey = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
function shiftMonth(ym, n) { const d = new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1); return monthKey(d); }
const ymLabel = ym => +ym.slice(0, 4) + '年' + +ym.slice(5, 7) + '月';
function monthStats(ym) {
  const L = state.log.filter(e => monthKey(e.t) === ym);
  const visits = {}; L.forEach(e => { visits[e.s] = (visits[e.s] || 0) + 1; });
  const firsts = {}; state.log.forEach(e => { if (!(e.s in firsts)) firsts[e.s] = e.t; });
  const fresh = Object.keys(firsts).filter(id => monthKey(firsts[id]) === ym).length;
  const top = Object.entries(visits).sort((a, b) => b[1] - a[1])[0];
  const endT = new Date(+ym.slice(0, 4), +ym.slice(5, 7), 1).getTime();
  const ptToEnd = state.log.filter(e => e.t < endT).reduce((a, e) => a + totalOf(e), 0);
  return { n: L.length, pt: L.reduce((a, e) => a + totalOf(e), 0), bonus: L.reduce((a, e) => a + (e.bx || 0), 0), castles: Object.keys(visits).length, fresh, days: new Set(L.map(e => dayKey(e.t))).size, top, rank: rankOf(ptToEnd)[1] };
}
function monthReportHTML(ym) {
  const a = monthStats(ym), b = monthStats(shiftMonth(ym, -1));
  const dl = (x, y, u) => { const d = x - y; return '<span class="delta ' + (d > 0 ? 'up' : d < 0 ? 'down' : '') + '">前月比 ' + (d > 0 ? '+' : '') + d.toLocaleString() + (u || '') + '</span>'; };
  const sb = byId(a.top ? a.top[0] : '');
  return '<div class="kv">' +
      '<div><span>出陣</span><b>' + a.n + '回</b>' + dl(a.n, b.n, '回') + '</div>' +
      '<div><span>獲得兵力</span><b>' + a.pt.toLocaleString() + '</b>' + dl(a.pt, b.pt) + '</div>' +
      '<div><span>訪れた城</span><b>' + a.castles + '城</b>' + dl(a.castles, b.castles, '城') + '</div>' +
      '<div><span>新たに制圧</span><b>' + a.fresh + '城</b></div>' +
      '<div><span>出陣した日</span><b>' + a.days + '日</b></div>' +
      '<div><span>うちボーナス</span><b>' + a.bonus.toLocaleString() + '</b></div>' +
    '</div>' +
    '<p class="note">本拠地：<b style="color:var(--paper)">' + (sb ? esc(sb.name) + '（' + a.top[1] + '回）' : '—') + '</b> ・ 月末の官位：<b style="color:var(--paper)">' + a.rank + '</b></p>' +
    (window.EMP_WAR ? EMP_WAR.monthReport(ym) : '');
}
function openMonthReport(ym) { showModal('月末の戦果報告', ymLabel(ym) + 'の戦果', monthReportHTML(ym)); }
function maybeReport(tries) {
  tries = tries || 0;
  const ym = shiftMonth(monthKey(Date.now()), -1);
  if (lsGet('mce_report_seen') === ym) return;
  const mine = state.log.some(e => monthKey(e.t) === ym);
  if (window.EMP_WAR && EMP_WAR.pending() && tries < 10) return setTimeout(() => maybeReport(tries + 1), 1000);
  const war = window.EMP_WAR && EMP_WAR.hasMonth(ym);
  if (!mine && !war) { lsSet('mce_report_seen', ym); return; }
  if (!$('#tour').hidden || !$('#modal').hidden) return setTimeout(() => maybeReport(tries), 1500);
  lsSet('mce_report_seen', ym); sfx('treasure'); openMonthReport(ym);
}

/* ---------- bridge for the multiplayer module (GitHub Pages build only) ---------- */
window.EMP = {
  get state() { return state; }, get D() { return D; }, get S() { return S; }, get selected() { return selected; }, get tab() { return tab; },
  LEVELS, lvOf, dayKey, esc, DAY, GUARD, toXY, MENUS,
  draw, say, playCuts, select, byId, renderSheet, renderMenu, refreshHeader, recompute, save, sfx,
  menuOpen: () => !$('#menu').hidden,
  showModal, formationOf, monthKey, shiftMonth, ymLabel,
  syncStores(list) {
    let ch = 0;
    list.forEach(c => {
      const s = byId(c.id);
      if (c.gone) {
        if (s && !(D[s.id] && D[s.id].v) && (s.e || 0) < c.t) { state.stores = state.stores.filter(x => x.id !== c.id); if (selected === c.id) closeSheet(); ch++; }
        return;
      }
      if (!s) {
        const [x, y] = toXY(c.lat, c.lng);
        if (state.stores.some(o => { const [a, b] = toXY(o.lat, o.lng); return Math.hypot(a - x, b - y) < 30; })) return;
        state.stores.push({ id: c.id, name: c.n, lat: c.lat, lng: c.lng, e: c.t, shared: true }); ch++; return;
      }
      if ((s.e || 0) < c.t) {
        if (s.name !== c.n || s.lat !== c.lat || s.lng !== c.lng) { s.name = c.n; s.lat = c.lat; s.lng = c.lng; ch++; }
        s.e = c.t;
      }
    });
    if (ch) { save(); recompute(); draw(); if (selected) renderSheet(); }
    return ch;
  },
  addStores(list) {
    let n = 0;
    list.forEach(x => { if (!byId(x.id)) { state.stores.push(x); n++; } });
    if (n) { save(); recompute(); draw(); }
    return n;
  }
};

recompute();
new ResizeObserver(resize).observe($('#wrap'));
resize(); fitAll(false); refreshHeader();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
setTimeout(connectCloud, 0);
setTimeout(() => { if (!lsGet('mce_tour_v2')) startTour(() => setTimeout(maybeReport, 600)); else maybeReport(); }, 900);
loadGoogle();
startGeo();
})();
